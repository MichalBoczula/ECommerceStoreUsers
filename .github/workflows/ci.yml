name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify acceptance operation matrix
        run: python3 scripts/check-acceptance-matrix.py

      - name: Verify generated description links
        run: python3 scripts/check-description-links.py

      - name: Verify operation-to-flow links
        run: |
          python3 scripts/generate-operation-links.py --output artifacts/verification/operation-links.json
          python3 scripts/test-operation-links.py
          python3 scripts/test-openapi-contract.py

      - name: Restore dependencies
        run: dotnet restore ECommerceStoreUsers.slnx

      - name: Verify formatting and static analysis
        run: dotnet format ECommerceStoreUsers.slnx --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build ECommerceStoreUsers.slnx --configuration Release --no-restore

      - name: Validate generated OpenAPI document
        run: bash scripts/validate-openapi.sh

  quality-gate:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
      - domain-unit-tests
      - application-unit-tests
      - infrastructure-integration-tests
      - acceptance-tests
      - secret-scan
      - dependency-review
    steps:
      - name: Require successful quality checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOMAIN_RESULT: ${{ needs.domain-unit-tests.result }}
          APPLICATION_RESULT: ${{ needs.application-unit-tests.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure-integration-tests.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance-tests.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          for check in BUILD DOMAIN APPLICATION INFRASTRUCTURE ACCEPTANCE SECRET_SCAN; do
            result_var="${check}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "success" ]]; then
              echo "$check must succeed; actual result: $result" >&2
              exit 1
            fi
          done

          case "$EVENT_NAME" in
            pull_request) expected_dependency_result=success ;;
            push) expected_dependency_result=skipped ;;
            *) echo "Unexpected event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ "$DEPENDENCY_REVIEW_RESULT" != "$expected_dependency_result" ]]; then
            echo "Dependency Review must be $expected_dependency_result on $EVENT_NAME; actual result: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi

  build-docker-image:
    # Dependency Review is intentionally skipped on push; only the successful
    # quality gate permits image work through that skipped ancestor.
    if: ${{ always() && !cancelled() && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality-gate

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ECommerceStoreUsers.API/Dockerfile
          push: false
          load: true
          tags: ecommerce-store-users:ci

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-users:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  domain-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ECommerceStoreUsers.slnx

      - name: Run domain unit tests
        run: >
          dotnet test ./tests/ECommerceStoreUsers.Domain.UnitTests/ECommerceStoreUsers.Domain.UnitTests.csproj
          --configuration Release
          --no-restore
          --verbosity normal
          --logger "trx;LogFileName=domain-unit-tests.trx"
          --results-directory ./TestResults/Domain
          --collect "XPlat Code Coverage"
          --
          "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura"
          "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[ECommerceStoreUsers.Domain]*"

      - name: Add domain unit tests summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem ./TestResults/Domain -Filter *.trx -Recurse | Select-Object -First 1

          Add-Content $env:GITHUB_STEP_SUMMARY "## Domain unit tests"
          Add-Content $env:GITHUB_STEP_SUMMARY ""

          if (-not $trx) {
            Add-Content $env:GITHUB_STEP_SUMMARY "No TRX file found."
            exit 0
          }

          [xml]$xml = Get-Content $trx.FullName
          $counters = $xml.TestRun.ResultSummary.Counters
          $failedResults = @($xml.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq "Failed" })

          Add-Content $env:GITHUB_STEP_SUMMARY "| Total | Passed | Failed | Skipped |"
          Add-Content $env:GITHUB_STEP_SUMMARY "|-------|--------|--------|---------|"
          Add-Content $env:GITHUB_STEP_SUMMARY "| $($counters.total) | $($counters.passed) | $($counters.failed) | $($counters.notExecuted) |"
          Add-Content $env:GITHUB_STEP_SUMMARY ""

          if ($failedResults.Count -eq 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY "All domain unit tests passed."
            exit 0
          }

          Add-Content $env:GITHUB_STEP_SUMMARY "### Failed tests"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "| Test | Error |"
          Add-Content $env:GITHUB_STEP_SUMMARY "|------|-------|"

          foreach ($result in $failedResults) {
            $testName = $result.testName
            $errorMessage = ""

            if ($result.Output -and $result.Output.ErrorInfo -and $result.Output.ErrorInfo.Message) {
              $errorMessage = $result.Output.ErrorInfo.Message
            }

            $testName = $testName -replace '\|', '/' -replace "`r", ' ' -replace "`n", ' '
            $errorMessage = $errorMessage -replace '\|', '/' -replace "`r", ' ' -replace "`n", ' '

            Add-Content $env:GITHUB_STEP_SUMMARY "| $testName | $errorMessage |"
          }

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.7

      - name: Create Domain coverage report
        run: >
          reportgenerator
          -reports:"./TestResults/Domain/**/coverage.cobertura.xml"
          -targetdir:"./TestResults/CoverageReport/Domain"
          -reporttypes:"Html;TextSummary"
          -assemblyfilters:"+ECommerceStoreUsers.Domain"

      - name: Enforce Domain line coverage threshold
        shell: bash
        run: |
          summary="./TestResults/CoverageReport/Domain/Summary.txt"
          coverage="$(sed -n 's/^[[:space:]]*Line coverage:[[:space:]]*\([0-9.]*\)%.*/\1/p' "$summary" | head -n 1)"
          if ! [[ "$coverage" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "Unable to read Domain line coverage from $summary." >&2
            exit 1
          fi
          echo "Domain line coverage: $coverage% (required: 70%)"
          awk -v coverage="$coverage" 'BEGIN { exit !(coverage + 0 >= 70) }' || {
            echo "Domain line coverage $coverage% is below the required 70%." >&2
            exit 1
          }

      - name: Publish Domain coverage summary
        if: always()
        run: |
          echo "## Domain coverage" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f ./TestResults/CoverageReport/Domain/Summary.txt ]]; then
            cat ./TestResults/CoverageReport/Domain/Summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Domain coverage report unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Domain coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-coverage-report
          path: ./TestResults/CoverageReport/Domain
          if-no-files-found: warn

      - name: Upload domain coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-coverage
          path: ./TestResults/Domain/
          if-no-files-found: warn

      - name: Fail job if domain unit tests failed
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem ./TestResults/Domain -Filter *.trx -Recurse | Select-Object -First 1

          if (-not $trx) {
            throw "Domain unit tests TRX file not found."
          }

          [xml]$xml = Get-Content $trx.FullName
          $failed = [int]$xml.TestRun.ResultSummary.Counters.failed

          if ($failed -gt 0) {
            throw "$failed domain unit test(s) failed."
          }

  application-unit-tests:
