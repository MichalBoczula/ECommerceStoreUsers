name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source contracts and boundaries
        run: bash scripts/ci.sh source
      - name: Restore and build
        run: bash scripts/ci.sh build
      - name: Verify formatting
        run: bash scripts/ci.sh format
      - name: Validate generated OpenAPI
        run: bash scripts/ci.sh contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-contract
          path: |
            artifacts/verification/openapi.json
            artifacts/verification/operation-links.json
            artifacts/verification/flows.json
            artifacts/verification/validation-policies.json
          if-no-files-found: warn

  documentation-bundle:
    needs: [build, acceptance-tests]
    uses: MichalBoczula/ECommerceStore.LiveDocs/.github/workflows/package-producer.yml@8759a9d52bb11c83bfa8a155ca0792e3a4e80b98
    with:
      tooling-ref: 8759a9d52bb11c83bfa8a155ca0792e3a4e80b98
      project: users
      features: tests/ECommerceStoreUsers.AcceptanceTests/Features

  archive-documentation:
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.quality-gate.result == 'success' && needs.build-docker-image.result == 'success' }}
    needs: [quality-gate, build-docker-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACCOUNT: ${{ vars.LIVEDOCS_STORAGE_ACCOUNT || 'stecproductsdevmb261013' }}
      DOC_VERSION: ${{ vars.LIVEDOCS_VERSION || 'v1' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: documentation-bundle
          path: artifacts
      - name: Upload verified documentation bundle and receipt
        shell: bash
        env:
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.LIVEDOCS_STORAGE_SAS_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$AZURE_STORAGE_SAS_TOKEN" || { echo 'Missing secret: LIVEDOCS_STORAGE_SAS_TOKEN' >&2; exit 1; }
          [[ "$ACCOUNT" =~ ^[a-z0-9]{3,24}$ ]] || { echo 'Invalid LiveDocs storage account' >&2; exit 1; }
          [[ "$DOC_VERSION" =~ ^v[1-9][0-9]*$ ]] || { echo 'Invalid LiveDocs version' >&2; exit 1; }

          bundle=artifacts/documentation-bundle.zip
          metadata="$RUNNER_TEMP/documentation-metadata.json"
          unzip -p "$bundle" bundle.json > "$metadata"
          jq -e --arg repository "$SOURCE_REPOSITORY" --arg commit "$SOURCE_COMMIT" --argjson run "$SOURCE_RUN_ID" \
            '.schemaVersion == 1 and .project == "users" and .repository == $repository and .commitSha == $commit and .workflowRunId == $run and (.generatedAt | type == "string")' \
            "$metadata" > /dev/null
          digest=$(sha256sum "$bundle" | cut -d ' ' -f 1)
          size=$(stat -c %s "$bundle")
          bundle_name="reports/users/$SOURCE_COMMIT/$digest.zip"
          receipt_name="candidates/$DOC_VERSION/users/$SOURCE_RUN_ID-$digest.json"
          bundle_url="https://$ACCOUNT.blob.core.windows.net/livedocs/$bundle_name"
          receipt=artifacts/documentation-reference.json
          jq --arg version "$DOC_VERSION" --arg url "$bundle_url" --arg digest "$digest" --argjson size "$size" \
            '{schemaVersion: 1, version: $version, reference: {project: .project, commitSha: .commitSha, generatedAt: .generatedAt, workflowRunId: .workflowRunId, artifact: {url: $url, sha256: $digest, sizeBytes: $size}}}' \
            "$metadata" > "$receipt"

          storage=(--account-name "$ACCOUNT" --container-name livedocs --sas-token "$AZURE_STORAGE_SAS_TOKEN" --only-show-errors)
          upload_once() {
            local file="$1" name="$2" content_type="$3" exists existing
            exists=$(az storage blob exists "${storage[@]}" --name "$name" --query exists --output tsv)
            case "$exists" in
              true|True)
                existing="$RUNNER_TEMP/existing-$(basename "$file")"
                az storage blob download "${storage[@]}" --name "$name" --file "$existing" --overwrite true --output none
                cmp --silent "$file" "$existing" || { echo "Immutable Blob has different bytes: $name" >&2; return 1; }
                ;;
              false|False)
                az storage blob upload "${storage[@]}" --name "$name" --file "$file" --content-type "$content_type" \
                  --overwrite false --if-none-match '*' --validate-content --output none
                ;;
              *) echo 'Unexpected Blob existence response' >&2; return 1 ;;
            esac
          }

          upload_once "$bundle" "$bundle_name" application/zip
          upload_once "$receipt" "$receipt_name" application/json
          printf 'Users documentation archived.\n\nBundle: %s\n\nReceipt: https://%s.blob.core.windows.net/livedocs/%s\n' \
            "$bundle_url" "$ACCOUNT" "$receipt_name" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-reference
          path: artifacts/documentation-reference.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  quality-gate:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
      - domain-unit-tests
      - application-unit-tests
      - infrastructure-integration-tests
      - acceptance-tests
      - documentation-bundle
      - secret-scan
      - dependency-review
    steps:
      - name: Require successful quality checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOMAIN_RESULT: ${{ needs.domain-unit-tests.result }}
          APPLICATION_RESULT: ${{ needs.application-unit-tests.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure-integration-tests.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance-tests.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation-bundle.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          for check in BUILD DOMAIN APPLICATION INFRASTRUCTURE ACCEPTANCE DOCUMENTATION SECRET_SCAN; do
            result_var="${check}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "success" ]]; then
              echo "$check must succeed; actual result: $result" >&2
              exit 1
            fi
          done

          case "$EVENT_NAME" in
            pull_request) expected_dependency_result=success ;;
            push) expected_dependency_result=skipped ;;
            *) echo "Unexpected event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ "$DEPENDENCY_REVIEW_RESULT" != "$expected_dependency_result" ]]; then
            echo "Dependency Review must be $expected_dependency_result on $EVENT_NAME; actual result: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi


  build-docker-image:
    # Dependency Review is intentionally skipped on push; only the successful
    # quality gate permits image work through that skipped ancestor.
    if: ${{ always() && !cancelled() && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality-gate

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ECommerceStoreUsers.API/Dockerfile
          push: false
          load: true
          tags: ecommerce-store-users:ci

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-users:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Record scanned image identity
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-users:ci)"
          test -n "$image_id"
          echo "Scanned image ID: $image_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and publish the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          repository=mb0101/ecommerce-store-users-api
          sha_tag="$repository:$GITHUB_SHA"
          latest_tag="$repository:latest"
          scanned_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-users:ci)"

          docker tag ecommerce-store-users:ci "$sha_tag"
          docker tag ecommerce-store-users:ci "$latest_tag"
          test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$sha_tag")"
          test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$latest_tag")"

          docker push "$sha_tag" | tee "$RUNNER_TEMP/push-sha.log"
          docker push "$latest_tag" | tee "$RUNNER_TEMP/push-latest.log"
          sha_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-sha.log" | tail -n 1)"
          latest_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-latest.log" | tail -n 1)"
          test -n "$sha_digest"
          test "$sha_digest" = "$latest_digest"
          echo "Published $sha_tag and $latest_tag from image $scanned_id with digest $sha_digest"  >> "$GITHUB_STEP_SUMMARY"


  domain-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify domain suite and coverage
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test domain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-test-results
          path: artifacts/verification/domain/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-coverage-report
          path: artifacts/verification/domain-coverage/
          if-no-files-found: warn

  application-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify application suite and coverage
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test application
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-test-results
          path: artifacts/verification/application/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-coverage-report
          path: artifacts/verification/application-coverage/
          if-no-files-found: warn

  infrastructure-integration-tests:
    # MongoDB 8 rejects kernels 6.19–7.0.13 (SERVER-121912).
    # The current Ubuntu 24.04 runner uses 6.17; keep real Mongo tests enabled.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify infrastructure suite and coverage
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test infrastructure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-test-results
          path: artifacts/verification/infrastructure/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-coverage-report
          path: artifacts/verification/infrastructure-coverage/
          if-no-files-found: warn

  acceptance-tests:
    # Match the supported kernel used by the MongoDB integration suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify acceptance suite
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-test-results
          path: artifacts/verification/acceptance/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-allure-results
          path: artifacts/allure-results/acceptance/
          if-no-files-found: error
          retention-days: 7
