            $errorMessage = $errorMessage -replace '\|', '/' -replace "`r", ' ' -replace "`n", ' '

            Add-Content $env:GITHUB_STEP_SUMMARY "| $testName | $errorMessage |"
          }

      - name: Upload acceptance test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-results
          path: ./TestResults/Acceptance/
          if-no-files-found: warn

      - name: Fail job if acceptance tests failed
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem ./TestResults/Acceptance -Filter *.trx -Recurse | Select-Object -First 1

          if (-not $trx) {
            throw "Acceptance tests TRX file not found."
          }

          [xml]$xml = Get-Content $trx.FullName
          $failed = [int]$xml.TestRun.ResultSummary.Counters.failed

          if ($failed -gt 0) {
            throw "$failed acceptance test(s) failed."
          }
