name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100

      - name: Restore dependencies
        run: dotnet restore ECommerceStoreUsers.slnx

      - name: Verify formatting and static analysis
        run: dotnet format ECommerceStoreUsers.slnx --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build ECommerceStoreUsers.slnx --configuration Release --no-restore

  docker-image-build:
    runs-on: ubuntu-latest
    needs:
      - build
      - secret-scan

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ECommerceStoreUsers.API/Dockerfile
          push: false
          load: true
          tags: ecommerce-store-users:ci

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-users:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  domain-unit-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100

      - name: Restore dependencies
        run: dotnet restore ECommerceStoreUsers.slnx

      - name: Run domain unit tests
        continue-on-error: true
        run: >
          dotnet test ./tests/ECommerceStoreUsers.Domain.UnitTests/ECommerceStoreUsers.Domain.UnitTests.csproj
          --configuration Release
          --no-restore
          --verbosity normal
          --logger "trx;LogFileName=domain-unit-tests.trx"
          --results-directory ./TestResults/Domain
          --collect "XPlat Code Coverage"
          --
          "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura"
          "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[ECommerceStoreUsers.Domain]*"

      - name: Add domain unit tests summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem ./TestResults/Domain -Filter *.trx -Recurse | Select-Object -First 1

          Add-Content $env:GITHUB_STEP_SUMMARY "## Domain unit tests"
          Add-Content $env:GITHUB_STEP_SUMMARY ""

          if (-not $trx) {
            Add-Content $env:GITHUB_STEP_SUMMARY "No TRX file found."
            exit 0
          }

          [xml]$xml = Get-Content $trx.FullName
          $counters = $xml.TestRun.ResultSummary.Counters
          $failedResults = @($xml.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq "Failed" })

          Add-Content $env:GITHUB_STEP_SUMMARY "| Total | Passed | Failed | Skipped |"
          Add-Content $env:GITHUB_STEP_SUMMARY "|-------|--------|--------|---------|"
          Add-Content $env:GITHUB_STEP_SUMMARY "| $($counters.total) | $($counters.passed) | $($counters.failed) | $($counters.notExecuted) |"
          Add-Content $env:GITHUB_STEP_SUMMARY ""

          if ($failedResults.Count -eq 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY "All domain unit tests passed."
            exit 0
          }

          Add-Content $env:GITHUB_STEP_SUMMARY "### Failed tests"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "| Test | Error |"
          Add-Content $env:GITHUB_STEP_SUMMARY "|------|-------|"

          foreach ($result in $failedResults) {
            $testName = $result.testName
            $errorMessage = ""

            if ($result.Output -and $result.Output.ErrorInfo -and $result.Output.ErrorInfo.Message) {
              $errorMessage = $result.Output.ErrorInfo.Message
            }

            $testName = $testName -replace '\|', '/' -replace "`r", ' ' -replace "`n", ' '
            $errorMessage = $errorMessage -replace '\|', '/' -replace "`r", ' ' -replace "`n", ' '

            Add-Content $env:GITHUB_STEP_SUMMARY "| $testName | $errorMessage |"
          }

      - name: Check domain line coverage
        if: always()
        shell: pwsh
        run: |
          $coverageFile = Get-ChildItem ./TestResults/Domain -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1

          if (-not $coverageFile) {
            throw "Domain coverage report not found."
          }

          [xml]$coverage = Get-Content $coverageFile.FullName
          $lineRate = [double]::Parse(
            $coverage.coverage.'line-rate',
            [System.Globalization.CultureInfo]::InvariantCulture)
          $lineCoverage = [math]::Round($lineRate * 100, 2)

          Add-Content $env:GITHUB_STEP_SUMMARY "## Domain coverage"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "| Metric | Result | Required |"
          Add-Content $env:GITHUB_STEP_SUMMARY "|--------|--------|----------|"
          Add-Content $env:GITHUB_STEP_SUMMARY "| Line coverage | $lineCoverage% | 70% |"

          if ($lineCoverage -lt 70) {
            throw "Domain line coverage is $lineCoverage%; required minimum is 70%."
          }

      - name: Upload domain coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-coverage
          path: ./TestResults/Domain/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Fail job if domain unit tests failed
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem ./TestResults/Domain -Filter *.trx -Recurse | Select-Object -First 1

          if (-not $trx) {
            throw "Domain unit tests TRX file not found."
          }

          [xml]$xml = Get-Content $trx.FullName
          $failed = [int]$xml.TestRun.ResultSummary.Counters.failed

          if ($failed -gt 0) {
            throw "$failed domain unit test(s) failed."
          }

