  infrastructure-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ECommerceStoreUsers.slnx

      - name: Run infrastructure integration tests
        run: >
          dotnet test ./tests/ECommerceStoreUsers.Infrastructure.UnitTests/ECommerceStoreUsers.Infrastructure.UnitTests.csproj
          --configuration Release
          --no-restore
          --verbosity normal
          --logger "trx;LogFileName=infrastructure-integration-tests.trx"
          --results-directory ./TestResults/Infrastructure
          --collect "XPlat Code Coverage"
          --
          "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura"
          "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[ECommerceStoreUsers.Infrastructure]*"

      - name: Add infrastructure integration tests summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem ./TestResults/Infrastructure -Filter *.trx -Recurse | Select-Object -First 1

          Add-Content $env:GITHUB_STEP_SUMMARY "## Infrastructure integration tests"
          Add-Content $env:GITHUB_STEP_SUMMARY ""

          if (-not $trx) {
            Add-Content $env:GITHUB_STEP_SUMMARY "No TRX file found."
            exit 0
          }

          [xml]$xml = Get-Content $trx.FullName
          $counters = $xml.TestRun.ResultSummary.Counters
          $failedResults = @($xml.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq "Failed" })

          Add-Content $env:GITHUB_STEP_SUMMARY "| Total | Passed | Failed | Skipped |"
          Add-Content $env:GITHUB_STEP_SUMMARY "|-------|--------|--------|---------|"
          Add-Content $env:GITHUB_STEP_SUMMARY "| $($counters.total) | $($counters.passed) | $($counters.failed) | $($counters.notExecuted) |"
          Add-Content $env:GITHUB_STEP_SUMMARY ""

          if ($failedResults.Count -eq 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY "All infrastructure integration tests passed."
            exit 0
          }

          Add-Content $env:GITHUB_STEP_SUMMARY "### Failed tests"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "| Test | Error |"
          Add-Content $env:GITHUB_STEP_SUMMARY "|------|-------|"

          foreach ($result in $failedResults) {
            $testName = $result.testName
            $errorMessage = ""

            if ($result.Output -and $result.Output.ErrorInfo -and $result.Output.ErrorInfo.Message) {
              $errorMessage = $result.Output.ErrorInfo.Message
            }

            $testName = $testName -replace '\|', '/' -replace '[\r\n]+', ' '
            $errorMessage = $errorMessage -replace '\|', '/' -replace '[\r\n]+', ' '

            Add-Content $env:GITHUB_STEP_SUMMARY "| $testName | $errorMessage |"
          }

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.7

      - name: Create Infrastructure coverage report
        run: |
          reportgenerator \
            -reports:"./TestResults/Infrastructure/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/CoverageReport/Infrastructure" \
            -reporttypes:"Html;TextSummary" \
            -assemblyfilters:"+ECommerceStoreUsers.Infrastructure"
          test -s ./TestResults/CoverageReport/Infrastructure/Summary.txt

      - name: Publish Infrastructure coverage summary
        if: always()
        run: |
          echo "## Infrastructure coverage (informational, no threshold)" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f ./TestResults/CoverageReport/Infrastructure/Summary.txt ]]; then
            cat ./TestResults/CoverageReport/Infrastructure/Summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Infrastructure coverage report unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Infrastructure coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-coverage-report
          path: ./TestResults/CoverageReport/Infrastructure
          if-no-files-found: warn

      - name: Upload infrastructure test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-test-results
          path: ./TestResults/Infrastructure/
          if-no-files-found: warn

      - name: Fail job if infrastructure integration tests failed
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem ./TestResults/Infrastructure -Filter *.trx -Recurse | Select-Object -First 1

          if (-not $trx) {
            throw "Infrastructure integration tests TRX file not found."
          }

          [xml]$xml = Get-Content $trx.FullName
          $failed = [int]$xml.TestRun.ResultSummary.Counters.failed

          if ($failed -gt 0) {
            throw "$failed infrastructure integration test(s) failed."
          }

