          Add-Content $env:GITHUB_STEP_SUMMARY "## Application coverage"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "| Metric | Result | Required |"
          Add-Content $env:GITHUB_STEP_SUMMARY "|--------|--------|----------|"
          Add-Content $env:GITHUB_STEP_SUMMARY "| Line coverage | $lineCoverage% | 70% |"

          if ($lineCoverage -lt 70) {
            throw "Application line coverage is $lineCoverage%; required minimum is 70%."
          }

      - name: Upload application coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-coverage
          path: ./TestResults/Application/
          if-no-files-found: warn

      - name: Fail job if application unit tests failed
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem ./TestResults/Application -Filter *.trx -Recurse | Select-Object -First 1

          if (-not $trx) {
            throw "Application unit tests TRX file not found."
          }

          [xml]$xml = Get-Content $trx.FullName
          $failed = [int]$xml.TestRun.ResultSummary.Counters.failed

          if ($failed -gt 0) {
            throw "$failed application unit test(s) failed."
          }


  infrastructure-integration-tests:
